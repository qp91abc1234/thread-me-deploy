# Nginx 配置文件
# 此文件会被复制到 /root/volume/nginx/conf.d/default.conf
# 用于配置前端 Admin 和后端 API 的反向代理

server {
    listen 80;
    server_name localhost;

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API 后端代理（NestJS，运行在 3000 端口）
    # 将 /api 前缀的请求转发到后端 API 服务
    location /api/ {
        # 使用容器名访问 API 服务（在同一 Docker 网络中）
        # 去掉 /api 前缀后转发到后端（/api/users -> /users）
        # 如果需要保留 /api 前缀，则改为 http://thread-me-api:3000/api
        proxy_pass http://thread-me-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 前端项目静态文件配置
    # 支持多个前端项目，通过路径前缀区分
    
    # 根路径默认指向 Admin 项目（可根据需要修改为其他项目）
    location = / {
        root /usr/share/nginx/html/admin;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 前端项目通用配置 - 支持多个项目（如 /admin, /zcc 等）
    # 匹配所有非根路径的前端项目
    location ~ ^/[^/]+(/.*)?$ {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # SPA 路由回退：文件不存在时重写到项目的 index.html
        try_files $uri $uri/ @spa_fallback;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # SPA 路由回退处理
    location @spa_fallback {
        rewrite ^/([^/]+)(/.*)?$ /$1/index.html last;
    }

    # Sourcemap 访问限制（IP 白名单）- 通用配置
    # 匹配所有前端项目的 sourcemaps 目录（如 /admin/sourcemaps/ ）
    # 只允许指定 IP 访问 sourcemap 文件，保护源码安全
    location ~ ^/[^/]+/sourcemaps/ {
        root /usr/share/nginx/html;
        
        # IP 白名单：只允许指定 IP 访问
        allow 192.168.101.102;
        deny all;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
