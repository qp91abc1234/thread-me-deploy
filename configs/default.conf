# ------------------------------------------------------------
    # 虚拟主机匹配：
        # 先按请求端口匹配 listen，再在命中端口的 server 中按请求头 Host 与 server_name 匹配；
        # 若 Host 不匹配任一 server_name，则使用该端口的 default_server（listen 80 default_server），
        # 未配置 default_server 则用该端口第一个 server
        # Host 默认由浏览器/客户端根据请求 URL 的主机部分自动设置（如访问 http://localhost/ 则 Host: localhost，用 IP 访问则 Host 为 IP）
    # location 匹配优先级（从高到低）：
        # 1. =  精确匹配
        # 2. ^~ 前缀匹配，同时匹配多个时，最长前缀优先
        # 3. ~ 与 ~* 正则匹配（~ 区分大小写，~* 不区分大小写；多个正则时按书写顺序，先匹配先生效）
        # 4. 优先级低于正则匹配的前缀匹配，与 2 一致
        # 命名 location（@xxx）仅能通过 try_files / rewrite / error_page 等内部跳转进入
# ------------------------------------------------------------
server {
    listen 80 default_server;
    server_name localhost;

    # 日志存储路径：访问日志、错误日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 安全响应头：防止点击劫持、XSS 攻击等
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # gzip 压缩：对静态文件及代理响应（如 API 返回的 JSON）等 gzip_types 内类型启用
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;    

    # 代理 API 请求到后端服务
    location /api/ {
        proxy_pass http://thread-me-api:3300/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 精确匹配，只允许访问 / 路径
    location = / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 允许指定 IP 访问 .map 文件，并禁止缓存
    location ~* \.map$ {
        root /usr/share/nginx/html;
        allow 220.200.0.78;     # 你当前的 IP https://ip.sb/
        # allow 10.0.0.0/8;     # 可以添加更多 IP 或网段
        deny all;
        add_header Cache-Control "no-cache" always;
    }

    # 静态资源（js/css/图片/字体等）：长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        gzip_static on;
    }

    # 禁止访问路径中含 /. 的请求（如 /.git、/.env、/.htaccess 等隐藏文件/目录），防止泄露
    location ~ /\. {
        deny all;           # 拒绝访问，返回 403
        access_log off;     # 不记录访问日志
        log_not_found off;  # 不记录“未找到”类日志
    }

    # 前缀匹配，命中所有请求，作为默认/兜底 location（SPA 或代理）
    # root：文件查找的根路径，实际路径 = root + URI
    # try_files：按顺序查找，第一个存在即返回
    #   $uri       - 按「文件」查找（root + URI 对应磁盘上的文件，无后缀也可）
    #   $uri/      - 按「目录」查找，命中后在该目录下用 index 找默认文件
    #   @spa_fallback - 前两者都不存在时的回退（如返回 index.html 交给前端路由）
    # index：当请求被解析为目录时，默认查找并返回的文件名（可多个，按顺序尝试）    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @spa_fallback;

        # 不缓存 HTML 文件访问以及目录访问的请求（最终返回 index.html 的请求）
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # try_files 未命中文件/目录时进入的命名 location（必须用 @ 开头）
    # 例：/dashboard/settings → /dashboard/index.html；last 表示用新 URI 重新走 location 查找
    location @spa_fallback {
        rewrite ^/([^/]+)(/.*)?$ /$1/index.html last;
    }

    # 健康检查：用来判断 Nginx 是否在正常响应
    location /health {
        access_log off;                 # 不记录访问日志
        return 200 "healthy\n";         # 立即返回 200，响应体为 healthy
        add_header Content-Type text/plain;
    }
}
